# Basic App Info
spring.application.name=waterbill
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.metrics.enabled=true
waterbill.excluded-paths=/actuator/**

# --- Waterbill Custom Config ---
waterbill.water-per-person-per-day=10
waterbill.days-in-month=30

# Lists/Arrays (Slabs)
waterbill.slab-capacities=500,1000,1500
waterbill.slab-rates=2,3,5,8

# Rates
waterbill.corporation-rate=1.0
waterbill.borewell-rate=1.5

# Map (BHK to Residents)
waterbill.bhk-to-resident-count.2=3
waterbill.bhk-to-resident-count.3=5

# --- MySQL Connection (Local Development) ---
# Note: Use localhost:3307 when running the JAR directly on your machine
# Note: Use db:3306 if this file is used inside Docker Compose
spring.datasource.url=jdbc:mysql://mysql_container:3306/my_app_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=user_name
spring.datasource.password=user_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Dialect for MySQL 5.7
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging
logging.level.com.example.waterbill=DEBUG
logging.level.org.springframework=INFO