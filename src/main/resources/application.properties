# Basic App Info
spring.application.name=waterbill
management.endpoint.health.show-details=always
management.metrics.enable.all=true

# --- Waterbill Custom Config ---
waterbill.api-key=water123
waterbill.water-per-person-per-day=10
waterbill.days-in-month=30

# Lists/Arrays (Slabs)
waterbill.slab-capacities=500,1000,1500
waterbill.slab-rates=2,3,5,8

# Rates
waterbill.corporation-rate=1.0
waterbill.borewell-rate=1.5

# Map (BHK to Residents)
waterbill.bhk-to-resident-count.2=3
waterbill.bhk-to-resident-count.3=5

# --- H2 File-Based Config ---
# This saves the DB to a file named 'waterbill-db.mv.db' in your user home directory
spring.datasource.url=jdbc:h2:file:~/waterbill-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (Hopefully this works now with the stable version!)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security Header Fix for H2 Console
spring.security.headers.frame.options=sameOrigin